name: knocksy_app
description: "Knocksy Tenant App — discover and rent properties."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # State management (kept for architecture parity with the dashboard)
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  country_picker: ^2.0.20
  flutter_svg: ^2.0.10+1
  feather_icons: ^1.2.0
  pin_code_fields: ^8.0.1
  confetti: ^0.7.0

  # Dev tool: preview the UI on many device sizes (disabled in release).
  device_preview: ^1.2.0

  # Utilities
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/home/
    - assets/icons/
